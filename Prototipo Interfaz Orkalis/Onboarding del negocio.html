<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { margin: 0; min-height: 100%; background: var(--surface-page); }
  #root { width: 100%; min-height: 100vh; }
  * { -webkit-tap-highlight-color: transparent; }
  @keyframes ork-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ork-pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes ork-spin { to { transform: rotate(360deg); } }
  @keyframes ork-check { from { stroke-dashoffset: 48; } to { stroke-dashoffset: 0; } }
  h1, h2, h3 { line-height: 1.12; }
</style>
</head>
