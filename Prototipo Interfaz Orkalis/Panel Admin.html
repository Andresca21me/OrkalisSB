<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orkalis · Panel de Administración</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { margin: 0; min-height: 100%; background: var(--surface-page); }
  #root { width: 100%; }
  .ork-shimmer {
    background: linear-gradient(90deg, var(--gray-100) 25%, var(--gray-200) 37%, var(--gray-100) 63%);
    background-size: 400% 100%; animation: ork-shimmer 1.4s ease-in-out infinite;
  }
  @keyframes ork-shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  @keyframes ork-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ork-pop { from { opacity: 0; transform: translateY(6px) scale(0.985); } to { opacity: 1; transform: none; } }
  @keyframes ork-toast { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  * { -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 999px; border: 3px solid var(--surface-page); }
  ::-webkit-scrollbar-thumb:hover { background: var(--gray-400); }
  h1, h2, h3, h4 { line-height: 1.12; }
  table { border-collapse: collapse; }
</style>
</head>
