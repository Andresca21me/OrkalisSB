<rect x="120" y="470" width="800" height="170" rx="10" fill="#F6F8FB" stroke="#C7D3DF" stroke-width="1"/>
<text x="136" y="496" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#0B1F33" font-weight="bold" font-style="normal" text-anchor="start">Reglas clave</text>
<text x="136" y="520" font-family="Helvetica, Arial, sans-serif" font-size="11.8" fill="#33475B" font-weight="normal" font-style="normal" text-anchor="start">• El origen de la cita (público / interno) determina el punto de entrada y qué validación aplica.</text>
<text x="136" y="540" font-family="Helvetica, Arial, sans-serif" font-size="11.8" fill="#33475B" font-weight="normal" font-style="normal" text-anchor="start">• Auto-confirmación por defecto: la reserva pública entra directo en Confirmada.</text>
<text x="136" y="560" font-family="Helvetica, Arial, sans-serif" font-size="11.8" fill="#33475B" font-weight="normal" font-style="normal" text-anchor="start">• &#x27;Solicitada&#x27; existe solo si el negocio activó la aprobación manual.</text>
<text x="136" y="580" font-family="Helvetica, Arial, sans-serif" font-size="11.8" fill="#33475B" font-weight="normal" font-style="normal" text-anchor="start">• Walk-in: en vivo entra en En progreso; retroactivo entra directo en Completada (horas pasadas).</text>
<text x="136" y="600" font-family="Helvetica, Arial, sans-serif" font-size="11.8" fill="#33475B" font-weight="normal" font-style="normal" text-anchor="start">• Guard de pago: completar exige el pago registrado; el cálculo financiero corre sobre el cierre real.</text>
<text x="136" y="620" font-family="Helvetica, Arial, sans-serif" font-size="11.8" fill="#33475B" font-weight="normal" font-style="normal" text-anchor="start">• Revertir una cita completada deshace ganancias y stock de forma transaccional (ADR-006).</text>
<rect x="960" y="470" width="120" height="170" rx="10" fill="#F6F8FB" stroke="#C7D3DF" stroke-width="1"/>
